<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uai • Provisionamento</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><strong>Uai Telecom</strong><span>Provisionamento leve</span></header>
<p id="status" role="status" aria-live="polite">Conectando…</p>
<form id="login" hidden><h1>Acesso do técnico</h1><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button>Entrar</button><p>Acesso restrito à equipe autorizada.</p></form>
<section id="workspace" hidden><nav><button id="menu" type="button">Menu</button><button id="refresh" type="button">Atualizar</button><button id="logout" type="button">Sair</button></nav><div id="messages" aria-live="polite"></div><div id="choices"></div><form id="entry"><label for="text">Resposta</label><div class="row"><input id="text" autocomplete="off" maxlength="500" placeholder="Digite o dado solicitado"><button>Enviar</button></div></form><button id="location" type="button">Enviar minha localização</button><button id="retry" type="button" hidden>Reconectar e conferir solicitação</button><p class="note">Se a conexão cair, não inicie outro provisionamento. Use Atualizar para conferir o resultado. A localização depende do GPS do celular.</p></section>
</main></body></html>
