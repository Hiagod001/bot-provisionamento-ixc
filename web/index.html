<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uai • Provisionamento</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/chat.css"><script src="/app.js" defer></script></head>
<body><main><header><img class="brand-logo" src="/uai-logo.png" alt="Uai Telecom" width="125" height="95"><div class="brand-title"><span class="eyebrow">ÁREA TÉCNICA</span><strong>Provisionamento</strong><span>Conexão de verdade, em campo.</span></div></header>
<p id="status" role="status" aria-live="polite">Conectando…</p>
<form id="login" hidden><h1>Acesso do técnico</h1><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button>Entrar</button><p>Acesso restrito à equipe autorizada.</p></form>
<section id="workspace" hidden><nav><button id="menu" type="button">Menu</button><button id="refresh" type="button">Atualizar</button><button id="logout" type="button">Sair</button></nav><div id="messages" role="log" aria-label="Conversa com o assistente" aria-live="polite"></div><div id="choices"></div><div id="composer"><form id="entry"><label class="sr-only" for="text">Mensagem</label><div class="row"><input id="text" autocomplete="off" maxlength="500" placeholder="Digite sua mensagem…"><button aria-label="Enviar mensagem">Enviar</button></div></form><button id="location" type="button">📍 Enviar localização</button><button id="retry" type="button" hidden>Reconectar e conferir solicitação</button><p class="note">Conexão caiu? Use Atualizar antes de repetir uma operação.</p></div></section>
</main></body></html>
